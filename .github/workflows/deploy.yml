name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Mondays at 04:00 UTC: picks up the sheets written during the week.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  data:
    name: Export the concepts and generate the questions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The only step that sees the Notion secrets. GitHub masks their values in the logs.
      - run: npm run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CONCEPTS_DATA_SOURCE_ID: ${{ secrets.NOTION_CONCEPTS_DATA_SOURCE_ID }}
      - run: npm run questions
      - uses: actions/upload-artifact@v7
        with:
          name: generated
          path: generated/
          retention-days: 1

  check:
    name: Lint, type-check and test
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated/
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    name: Build and push the image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated/

      # The weekly run rebuilds the same commit with new data: the run number keeps
      # every image tag unique, so a rollback always targets the exact image.
      - name: Compute version tag and image name
        id: tag
        run: |
          echo "value=sha-$(git rev-parse --short=7 HEAD)-run${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.value }}
            ${{ steps.tag.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up the SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # The deploy key is bound to a forced command on the VPS: it can only
      # run deploy-software-quizz.sh, with the image tag as its single argument.
      - name: Trigger the deployment
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "${{ needs.build.outputs.tag }}"
